[package]
name = "skallagrim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
default-run = "skallagrim"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tiny-skia = "0.12"
minifb = "0.29"
fontdue = "0.9"

[profile.release]
lto = "thin"

[[bin]]
name = "skallagrim"
path = "src/main.rs"

[[bin]]
name = "skallagrim-gui"
path = "src/bin/gui.rs"
